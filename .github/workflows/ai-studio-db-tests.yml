# .github/workflows/ai-studio-db-tests.yml
# PIENHS CULT OS / AI Studio MVP — testy migracji ai_studio_jobs_v1 (db/ai_studio_jobs_v1/).
#   sql:      harness SQL + współbieżność na PostgreSQL 16 i 17.6 (wersja produkcji)
#   supabase: audyt na lokalnym stosie Supabase (CLI): zgodność z produkcją, PostgREST, Auth, Realtime
# Bez sekretów i bez dostępu do projektów Supabase.
name: ai-studio-db-tests

on:
  push:
    paths:
      - "db/ai_studio_jobs_v1/**"
      - ".github/workflows/ai-studio-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-studio-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17.6"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      ALLOW_ROLE_RESET: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Klient psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Testy migracji (PostgreSQL ${{ matrix.pg }})
        shell: bash
        run: bash db/ai_studio_jobs_v1/run_db_tests.sh 2>&1 | tee "test-pg${{ matrix.pg }}.log"
      - name: Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-studio-db-tests-pg${{ matrix.pg }}
          path: test-pg${{ matrix.pg }}.log

  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: db/ai_studio_jobs_v1/supabase_audit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Klient psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Zależności (supabase-js)
        run: npm ci --no-audit --no-fund
      - name: Stos Supabase (PostgreSQL 17, PostgREST, Auth, Realtime)
        run: supabase start --workdir .
      - name: Audyt
        env:
          OUT_DIR: ${{ runner.temp }}/supabase-audit
        run: bash run_supabase_audit.sh 2>&1 | tee "${RUNNER_TEMP}/supabase-audit.log"
      - name: Zatrzymanie stosu
        if: always()
        run: supabase stop --no-backup --workdir . || true
      - name: Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-studio-supabase-audit
          path: |
            ${{ runner.temp }}/supabase-audit.log
            ${{ runner.temp }}/supabase-audit/
