name: Type Check
on: [push, pull_request]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: ${{ hashFiles('package.json') != '' && (hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != '') }}
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json') == '' && hashFiles('npm-shrinkwrap.json') == '' }}
        with:
          node-version: '22'

      - name: Install deps (lockfile)
        if: ${{ hashFiles('package.json') != '' && (hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != '') }}
        run: npm ci

      - name: Install deps (no lockfile)
        if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json') == '' && hashFiles('npm-shrinkwrap.json') == '' }}
        run: npm install

      - name: Type check
        if: ${{ hashFiles('package.json') != '' && hashFiles('tsconfig.json', 'tsconfig.*.json') != '' }}
        run: npx tsc --noEmit
