name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - if: ${{ hashFiles('package.json') != '' && hashFiles('index.html', 'vite.config.*') != '' }}
        run: npm run build
