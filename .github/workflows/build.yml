name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: '22'
          cache: npm
      - name: Install deps (lockfile)
        if: ${{ hashFiles('package.json') != '' && (hashFiles('package-lock.json') != '' || hashFiles('npm-shrinkwrap.json') != '') }}
        run: npm ci
      - name: Install deps (no lockfile)
        if: ${{ hashFiles('package.json') != '' && hashFiles('package-lock.json') == '' && hashFiles('npm-shrinkwrap.json') == '' }}
        run: npm install
      - name: Build
        if: ${{ hashFiles('package.json') != '' }}
      - run: npm ci
      - if: ${{ hashFiles('package.json') != '' && hashFiles('index.html', 'vite.config.*') != '' }}
        run: npm run build
